name: Deploy

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build Backend Image
        run: |

          docker build \
            -t ghcr.io/${{ github.repository_owner }}/todo-backend:latest \
            ./backend

      - name: Push Backend Image
        run: |

          docker push \
            ghcr.io/${{ github.repository_owner }}/todo-backend:latest

      - name: Build Frontend Image
        run: |

          docker build \
            -t ghcr.io/${{ github.repository_owner }}/todo-frontend:latest \
            ./frontend

      - name: Push Frontend Image
        run: |

          docker push \
            ghcr.io/${{ github.repository_owner }}/todo-frontend:latest

