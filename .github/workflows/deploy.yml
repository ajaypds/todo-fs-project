name: Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build Backend Image
        run: |

          docker build \
            -t ghcr.io/${{ github.repository_owner }}/todo-backend:latest \
            ./backend

      - name: Push Backend Image
        run: |

          docker push \
            ghcr.io/${{ github.repository_owner }}/todo-backend:latest

      - name: Build Frontend Image
        run: |

          docker build \
            -t ghcr.io/${{ github.repository_owner }}/todo-frontend:latest \
            ./frontend

      - name: Push Frontend Image
        run: |

          docker push \
            ghcr.io/${{ github.repository_owner }}/todo-frontend:latest

      - name: Build MCP Server Image
        run: |

          docker build \
            -t ghcr.io/${{ github.repository_owner }}/todo-mcp-server:latest \
            ./mcp-server

      - name: Push MCP Server Image
        run: |

          docker push \
            ghcr.io/${{ github.repository_owner }}/todo-mcp-server:latest

      # - name: Copy docker-compose.yml to EC2
      #   uses: appleboy/scp-action@v0.1.7
      #   with:
      #     host: ${{ secrets.EC2_HOST }}
      #     username: ${{ secrets.EC2_USER }}
      #     key: ${{ secrets.EC2_SSH_KEY }}
      #     source: "docker-compose.yml"
      #     target: "todo-fs-project"
      #     overwrite: true

      - name: Deploy to EC2

        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}

          username: ${{ secrets.EC2_USER }}

          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            cd ~/todo-fs-project

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            echo "${{ secrets.GHCR_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin 2>/dev/null || true

            docker compose down

            docker compose pull

            docker compose up -d

            docker image prune -af
