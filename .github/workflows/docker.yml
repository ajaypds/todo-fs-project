name: Docker Build

on:
  push:
    branches:
      - dev
      - master

  pull_request:
    branches:
      - master

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        run: |
          docker build \
            -t todo-backend \
            ./backend

      - name: Build Frontend Image
        run: |
          docker build \
            -t todo-frontend \
            ./frontend
