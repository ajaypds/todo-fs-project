services:
  postgres:
    image: postgres:16
    container_name: todo-postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    # build:
    #   context: ./backend
    image: ghcr.io/ajaypds/todo-backend:latest
    container_name: todo-backend
    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      - postgres

    environment:
      DB_URL: "${DB_URL}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    # build:
    #   context: ./frontend
    image: ghcr.io/ajaypds/todo-frontend:latest
    container_name: todo-frontend
    ports:
      - "127.0.0.1:3000:80"

    depends_on:
      - backend

    restart: unless-stopped

  mcp-server:
    # build:
    #   context: ./mcp-server
    image: ghcr.io/ajaypds/todo-mcp-server:latest
    container_name: todo-mcp-server
    ports:
      - "127.0.0.1:3001:3001"

    depends_on:
      - backend

    environment:
      PORT: "3001"
      MCP_TRANSPORT: "sse"
      TODOFLOW_BASE_URL: "http://backend:8080"
      TODOFLOW_API_KEY: "${TODOFLOW_API_KEY:-}"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:

